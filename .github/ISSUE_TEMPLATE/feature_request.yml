name: Feature request
description: Propose an improvement to Sapphire Helper or its documentation.
labels: ["feature request"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and the behaviour you want. This form is for Sapphire Helper development, including documentation improvements.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the proposed improvement.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected, and what is difficult or missing in the current workflow?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behaviour
      description: Explain how the improvement should work, including relevant user/staff actions, permissions and notifications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or current workaround
      description: Describe any existing approach and why it is insufficient.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, screenshots or implementation notes that help explain the request.
